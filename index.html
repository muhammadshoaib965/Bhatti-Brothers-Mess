<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhatti Brothers Mess Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h2 { color: #2980b9; margin-top: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .ledger-card { background-color: #e9ecef; padding: 15px; border-radius: 5px; margin-top: 15px; display: none; }
        .ledger-card p { margin: 5px 0; font-size: 16px; }
        .loader { display: none; text-align: center; font-style: italic; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bhatti Brothers Mess System</h1>

    <h2>➕ Add Faculty/Staff Entry</h2>
    <div class="form-group">
        <label>Date</label>
        <input type="date" id="entryDate" required>
    </div>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="entryEmail" placeholder="staff@example.com" required>
    </div>
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="entryName" placeholder="Enter Full Name" required>
    </div>
    <div class="form-group">
        <label>Item / Meal</label>
        <select id="entryItem">
            <option value="">Loading menu items...</option>
        </select>
    </div>
    <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="entryQty" value="1" min="1" required>
    </div>
    <button onclick="submitEntry()">Submit Entry</button>
    <div id="entryLoader" class="loader">Submitting... please wait.</div>
    <div id="entryMsg" class="result-box"></div>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;">

    <h2>🔍 Check User Ledger</h2>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="ledgerEmail" placeholder="Enter email to check balance">
    </div>
    <button onclick="checkLedger()">Check Balance</button>
    <div id="ledgerLoader" class="loader">Fetching records...</div>
    
    <div id="ledgerResult" class="ledger-card">
        <p><strong>Name:</strong> <span id="l-name"></span></p>
        <p><strong>Role:</strong> <span id="l-role"></span></p>
        <p><strong>Total Billed:</strong> Rs. <span id="l-billed"></span></p>
        <p><strong>Total Paid:</strong> Rs. <span id="l-paid"></span></p>
        <p style="font-size: 18px; color: #c0392b;"><strong>Current Arrears:</strong> Rs. <span id="l-arrears"></span></p>
    </div>
    <div id="ledgerError" class="result-box error"></div>
</div>

<script>
    // ==========================================
    // PASTE YOUR WEB APP URL BELOW
    // ==========================================
    const SCRIPT_URL = 'YOUR_WEB_APP_URL_HERE'; 

    // 1. Load Dynamic Menu Items on page load
    window.onload = function() {
        if(SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbwGgnoLayT75LMjbhxxTgo7mQbFds0zp2OWSt9drtgWX6e6MT2KzRejgIktYADDpU7u2g/exec') {
            alert("Please update the SCRIPT_URL in the HTML file with your actual Google Web App URL!");
            return;
        }

        fetch(SCRIPT_URL + '?action=getMenuItems')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('entryItem');
                select.innerHTML = ''; 
                data.forEach(item => {
                    let option = document.createElement('option');
                    option.value = item;
                    option.text = item;
                    select.appendChild(option);
                });
            }).catch(err => console.error("Error loading menu:", err));
        
        // Set today's date as default
        document.getElementById('entryDate').valueAsDate = new Date();
    };

    // 2. Submit Entry to Google Sheet
    function submitEntry() {
        const date = document.getElementById('entryDate').value;
        const email = document.getElementById('entryEmail').value;
        const name = document.getElementById('entryName').value;
        const itemName = document.getElementById('entryItem').value;
        const qty = document.getElementById('entryQty').value;

        if(!date || !email || !name || !itemName) {
            showMsg('entryMsg', 'Please fill all required fields.', 'error');
            return;
        }

        document.getElementById('entryLoader').style.display = 'block';
        document.getElementById('entryMsg').style.display = 'none';

        const payload = {
            action: 'addPortalEntry',
            date: date,
            email: email,
            name: name,
            itemName: itemName,
            quantity: qty
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('entryLoader').style.display = 'none';
            if(data.status === 'Success') {
                showMsg('entryMsg', 'Entry added successfully!', 'success');
                // Reset standard fields
                document.getElementById('entryItem').selectedIndex = 0;
                document.getElementById('entryQty').value = 1;
            } else {
                showMsg('entryMsg', 'Error: ' + data.message, 'error');
            }
        })
        .catch(err => {
            document.getElementById('entryLoader').style.display = 'none';
            showMsg('entryMsg', 'Connection Error.', 'error');
        });
    }

    // 3. Fetch Ledger Balance
    function checkLedger() {
        const email = document.getElementById('ledgerEmail').value;
        if(!email) return;

        document.getElementById('ledgerLoader').style.display = 'block';
        document.getElementById('ledgerResult').style.display = 'none';
        document.getElementById('ledgerError').style.display = 'none';

        fetch(SCRIPT_URL + '?action=getLedger&email=' + encodeURIComponent(email))
            .then(response => response.json())
            .then(data => {
                document.getElementById('ledgerLoader').style.display = 'none';
                if(data.error) {
                    showMsg('ledgerError', data.error, 'error');
                } else {
                    document.getElementById('ledgerResult').style.display = 'block';
                    document.getElementById('l-name').innerText = data['Name'] || 'N/A';
                    document.getElementById('l-role').innerText = data['Role'] || 'N/A';
                    document.getElementById('l-billed').innerText = data['Total Billed'] || '0';
                    document.getElementById('l-paid').innerText = data['Total Paid'] || '0';
                    document.getElementById('l-arrears').innerText = data['Current Balance (Arrears)'] || '0';
                }
            })
            .catch(err => {
                document.getElementById('ledgerLoader').style.display = 'none';
                showMsg('ledgerError', 'Connection Error.', 'error');
            });
    }

    // Utility function to show messages
    function showMsg(elementId, text, type) {
        const el = document.getElementById(elementId);
        el.innerText = text;
        el.className = 'result-box ' + type;
        el.style.display = 'block';
    }
</script>

</body>
</html>
