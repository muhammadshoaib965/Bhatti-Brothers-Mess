<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhatti Brothers Mess Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 5px;}
        .item-row { display: flex; align-items: center; justify-content: space-between; }
        .item-row input[type="number"] { width: 80px; margin-left: 10px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 5px; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #3498db; color: white; }
        .loader { display: none; text-align: center; color: #7f8c8d; font-style: italic; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 5px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bhatti Brothers Mess System</h1>

    <h2>➕ Add Faculty/Staff Items</h2>
    <div class="form-group">
        <label>Date</label>
        <input type="date" id="entryDate" required>
    </div>
    <div class="form-group">
        <label>Select Staff</label>
        <select id="staffDropdown" onchange="autoFillName()">
            <option value="">-- Select Staff Email --</option>
        </select>
    </div>
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="entryName" readonly style="background-color: #e9ecef;">
    </div>
    
    <label>Select Items & Quantities</label>
    <div class="checkbox-grid" id="menuContainer"></div>
    
    <button onclick="submitMultiple()">Submit Selected Items</button>
    <div id="entryLoader" class="loader">Submitting...</div>
    <div id="entryMsg" class="result-box"></div>

    <h2 style="margin-top: 40px;">🔍 Check Detailed History</h2>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="historyEmail" placeholder="Enter email (e.g., student1@example.com)">
    </div>
    <button onclick="checkHistory()">Get Detailed Bill</button>
    <div id="historyLoader" class="loader">Fetching records...</div>
    
    <div id="historyTableContainer" style="display: none; margin-top: 20px;">
        <table id="historyTable">
            <thead>
                <tr><th>Date</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================
    // PASTE YOUR NEW WEB APP URL HERE
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGgnoLayT75LMjbhxxTgo7mQbFds0zp2OWSt9drtgWX6e6MT2KzRejgIktYADDpU7u2g/exec'; 
    let staffData = [];

    window.onload = async function() {
        document.getElementById('entryDate').valueAsDate = new Date();
        
        try {
            // Load Menu Items
            const menuRes = await fetch(SCRIPT_URL + '?action=getMenuItems');
            const menuData = await menuRes.json();
            const container = document.getElementById('menuContainer');
            menuData.forEach(item => {
                let id = item.replace(/[^a-zA-Z0-9]/g, ''); 
                container.innerHTML += `
                    <div class="item-row">
                        <label><input type="checkbox" class="item-checkbox" value="${item}"> ${item}</label>
                        <input type="number" id="qty-${id}" value="1" min="1" disabled>
                    </div>`;
            });
            document.querySelectorAll('.item-checkbox').forEach(chk => {
                chk.addEventListener('change', function() {
                    let id = this.value.replace(/[^a-zA-Z0-9]/g, '');
                    document.getElementById('qty-' + id).disabled = !this.checked;
                });
            });

            // Load Staff
            const staffRes = await fetch(SCRIPT_URL + '?action=getStaff');
            staffData = await staffRes.json();
            const dropdown = document.getElementById('staffDropdown');
            staffData.forEach(staff => dropdown.innerHTML += `<option value="${staff.email}">${staff.email}</option>`);
        } catch (err) {
            console.error("Failed to load initial data", err);
        }
    };

    function autoFillName() {
        const selectedEmail = document.getElementById('staffDropdown').value;
        const staff = staffData.find(s => s.email === selectedEmail);
        document.getElementById('entryName').value = staff ? staff.name : '';
    }

    async function submitMultiple() {
        const date = document.getElementById('entryDate').value;
        const email = document.getElementById('staffDropdown').value;
        const name = document.getElementById('entryName').value;
        
        let selectedItems = [];
        document.querySelectorAll('.item-checkbox:checked').forEach(chk => {
            let id = chk.value.replace(/[^a-zA-Z0-9]/g, '');
            let qty = document.getElementById('qty-' + id).value;
            selectedItems.push({ itemName: chk.value, quantity: qty });
        });

        if(!email || selectedItems.length === 0) { alert("Select staff and items."); return; }

        document.getElementById('entryLoader').style.display = 'block';
        document.getElementById('entryMsg').style.display = 'none';

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" }, // Prevents CORS errors
                redirect: 'follow', // Crucial for Google Apps Script
                body: JSON.stringify({ action: 'addMultipleEntries', date: date, email: email, name: name, items: selectedItems })
            });
            const data = await response.json();
            document.getElementById('entryLoader').style.display = 'none';
            if(data.status === 'Success') {
                let msg = document.getElementById('entryMsg');
                msg.innerText = "Items added successfully!";
                msg.className = "result-box success";
                msg.style.display = "block";
                document.querySelectorAll('.item-checkbox').forEach(chk => { chk.checked = false; chk.dispatchEvent(new Event('change')); });
            }
        } catch(err) {
            document.getElementById('entryLoader').style.display = 'none';
            alert("Error connecting to server.");
        }
    }

    async function checkHistory() {
        const email = document.getElementById('historyEmail').value;
        if(!email) return;
        
        document.getElementById('historyLoader').style.display = 'block';
        document.getElementById('historyTableContainer').style.display = 'none';

        try {
            const res = await fetch(SCRIPT_URL + '?action=getHistory&email=' + encodeURIComponent(email));
            const data = await res.json();
            document.getElementById('historyLoader').style.display = 'none';
            
            const tbody = document.querySelector('#historyTable tbody');
            tbody.innerHTML = '';
            
            if(data.error) {
                 alert("Error: " + data.error); return;
            }

            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>';
            } else {
                let grandTotal = 0;
                data.forEach(row => {
                    grandTotal += parseFloat(row.total);
                    tbody.innerHTML += `<tr><td>${row.date}</td><td>${row.item}</td><td>${row.qty}</td><td>Rs. ${row.price}</td><td><strong>Rs. ${row.total}</strong></td></tr>`;
                });
                tbody.innerHTML += `<tr><td colspan="4" style="text-align:right;"><strong>GRAND TOTAL</strong></td><td style="color:red;"><strong>Rs. ${grandTotal}</strong></td></tr>`;
            }
            document.getElementById('historyTableContainer').style.display = 'block';
        } catch(err) {
            document.getElementById('historyLoader').style.display = 'none';
            alert("Error fetching history.");
        }
    }
</script>
</body>
</html>
